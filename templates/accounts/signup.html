{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
    <h1>Log in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions"><button type="submit">Log in</button></div>
    </form>
    <p class="muted">No account? <a href="{% url 'accounts:signup' %}">Sign up</a>.</p>
{% endblock %}
