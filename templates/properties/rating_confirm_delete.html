{% extends "base.html" %}
{% block content %}
    <h1>Delete your rating?</h1>
    <p>Delete your rating for <strong>{{ house.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Delete</button>
            <a href="{% url 'properties:house_detail' workspace.slug house.pk %}">Cancel</a>
        </div>
    </form>
{% endblock %}
