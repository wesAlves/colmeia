{% extends "base.html" %}
{% block content %}
    <h1>Delete photo?</h1>
    {% if photo.caption %}<p>“{{ photo.caption }}”</p>{% endif %}
    <img src="{{ photo.image.url }}" alt="" style="max-width:320px;border-radius:6px;">
    <form method="post" style="margin-top:1rem;">
        {% csrf_token %}
        <div class="actions">
            <button type="submit">Delete</button>
            <a href="{% url 'properties:house_detail' workspace.slug house.pk %}">Cancel</a>
        </div>
    </form>
{% endblock %}
